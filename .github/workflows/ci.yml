name: ci

# The job checks out, installs, and runs the checks. It writes nothing back —
# no comments, no commits, no releases — so the token is read-only. Without
# this block the workflow inherits the repository default, which may be
# write-all, and CodeQL's actions/missing-workflow-permissions flags it.
permissions:
  contents: read

on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ci
