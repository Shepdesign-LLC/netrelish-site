name: sync-changelog

# Keeps /roadmap's changelog in step with the app. Every morning it reads
# Shepdesign-LLC/NetRelish (public, so no token is needed to read it), regenerates
# src/lib/changelog.generated.ts, and opens or updates one pull request when anything
# changed. CI runs on that pull request like any other; merging it ships the change.
#
# Run it by hand: Actions → sync-changelog → Run workflow.
# The app repo can also start it at once with a repository_dispatch of type
# "netrelish-release" (needs a token with access to this repo).
#
# One-time setting: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests" must be on, at the org and in this repo.

on:
  schedule:
    - cron: '0 14 * * *'        # 7:00 am Arizona
  workflow_dispatch: {}
  repository_dispatch:
    types: [netrelish-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-changelog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the app repo, with its tags
        run: git clone --filter=blob:none https://github.com/Shepdesign-LLC/NetRelish.git "$RUNNER_TEMP/app"

      - name: Regenerate the changelog
        run: node scripts/sync-changelog.mjs "$RUNNER_TEMP/app"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/lib/changelog.generated.ts; then
            echo "Changelog already matches the app."; exit 0
          fi
          branch=bot/sync-changelog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add src/lib/changelog.generated.ts
          git commit -m "changelog: sync from NetRelish"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "changelog: sync from NetRelish" \
              --body "The app's release notes or merged features changed. Generated by the daily sync-changelog workflow from Shepdesign-LLC/NetRelish."
          fi
